name: Validate portable setup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        shell: pwsh
        run: ./tests/validate.ps1
      - name: Exercise installer dry run
        shell: pwsh
        run: ./install.ps1 -DryRun
      - name: Exercise collector dry run
        shell: pwsh
        run: ./collect.ps1 -DryRun

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n install.sh collect.sh
      - name: Exercise installer dry run
        run: ./install.sh --dry-run
      - name: Exercise collector dry run
        run: ./collect.sh --dry-run
